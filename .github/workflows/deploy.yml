# GitHub Pages deploy. Runs on every push to main, and by hand from the Actions tab. Needs
# Settings > Pages > Source: "GitHub Actions". Tests run first, so a failing test stops the deploy.
# Builds the one-file chatbot (no server) into ./dist-static.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static
      - id: deployment
        uses: actions/deploy-pages@v4
